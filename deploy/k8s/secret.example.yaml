# EXAMPLE ONLY. Do not commit real values. Prefer an external secret store
# (External Secrets Operator, Vault CSI, Sealed Secrets) that renders this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: rconsole-secrets
  namespace: rconsole
type: Opaque
stringData:
  oidc_client_secret: "<from your IdP>"
  redis_viewer_password: "<rc-viewer ACL password>"
  redis_operator_password: "<rc-operator ACL password>"
  redis_admin_password: "<rc-admin ACL password>"
  bootstrap_admin_password: "<long random; must be changed at first login>"
  totp_encryption_key: "<openssl rand -hex 32; to rotate, add a second key to the ring (docs/OPERATIONS.md 6a)>"
