name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the comment names the release); Dependabot keeps them current.
# The runner image is pinned too, so an image migration is a reviewed change rather than a surprise.
env:
  NODE_VERSION: "24.11"
  PNPM_VERSION: "11.7.0"

jobs:
  checks:
    name: install, typecheck, unit tests, audit, SBOM
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - name: Install (frozen lockfile, no unapproved install scripts)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Third-party notices are up to date
        run: node scripts/third-party-notices.ts --check
      - name: Sandbox (Redis 8, Keycloak, generated secrets)
        run: bash tests/e2e/ci/sandbox.sh
      - name: Topology (cluster, Sentinel, mutual TLS)
        run: |
          echo "RC_TOPO_PASSWORD=$(openssl rand -hex 24)" >> .env
          set -a; source .env; set +a
          echo "::add-mask::$RC_TOPO_PASSWORD"
          bash apps/server/scripts/topology.sh up
      - name: Full unit and integration suites (including topology)
        run: pnpm test
      - name: Dependency audit
        run: pnpm audit --audit-level=moderate
      - name: SBOM (CycloneDX, production dependencies)
        run: pnpm sbom --sbom-format cyclonedx --prod > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: sbom.cdx.json }

  image:
    name: build container image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: redis-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (non-root, read-only rootfs, config validation)
        run: |
          set -eu
          test "$(docker run --rm --entrypoint node redis-console:ci -e 'console.log(process.getuid())')" != "0"
          # Without a config the server must refuse to start (fail closed).
          if docker run --rm --read-only redis-console:ci; then echo "server started without config" >&2; exit 1; fi
          # No package managers in the final image.
          if docker run --rm --entrypoint sh redis-console:ci -c 'command -v npm || command -v pnpm || command -v corepack'; then exit 1; fi
      - name: Start production image and exercise HTTP health and SPA
        run: bash scripts/ci-image-smoke.sh

  e2e:
    name: e2e (Playwright, Chromium)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Playwright browser
        run: pnpm --filter @rconsole/e2e exec playwright install --with-deps chromium
      - name: Sandbox (Redis 8, Keycloak, generated secrets)
        run: bash tests/e2e/ci/sandbox.sh
      - name: E2E
        run: pnpm test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14
