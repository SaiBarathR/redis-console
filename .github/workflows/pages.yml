name: website

# Builds site/ (Astro) and publishes it to GitHub Pages at https://saibarathr.github.io/redis-console/.
# The site reads docs/ (the guides and release notes) and apps/server/package.json (the version) at build time, so
# changes there redeploy it too.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "apps/server/package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, but a running deployment finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install (frozen lockfile)
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
